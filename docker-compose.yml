services:
  db:
    image: postgres:15-alpine
    container_name: skillbridge_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-skillbridge_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-skillbridge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: skillbridge_web
    restart: always
    command: gunicorn skillbridge.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/static/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
